name: Refresh profile stats

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - refresh_stats.py
      - .github/workflows/refresh-stats.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render identity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python refresh_stats.py
      - name: Commit
        run: |
          git config user.name "Forge"
          git config user.email "forge-aidd@agentmail.to"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Refresh identity card stats"
          git push
